<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Accepted</title>
<style>
  :root{
    --bg:#0F1115; --panel:#171A21; --line:#252A34; --ink:#E8EAED; --dim:#9AA0A6;
    --todo:#5F6368; --active:#4285F4; --blocked:#EA4335; --done:#34A853; --gold:#F9AB00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:100%}
  header{grid-column:1/-1;padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .tag{font-size:11px;color:var(--dim)}
  .counts{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--dim)}
  .counts b{color:var(--ink);font-weight:600}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-size:12px;max-width:340px}
  main{position:relative;overflow:auto;padding:24px}
  aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .sect{padding:12px 16px;border-bottom:1px solid var(--line)}
  .sect h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);
    margin:0 0 8px}
  #journal{flex:1;overflow-y:auto;padding:12px 16px}
  .entry{padding:7px 0;border-bottom:1px solid #1D212A;font-size:12.5px}
  .entry:last-child{border-bottom:0}
  .who{font-weight:600;font-size:11px;letter-spacing:.3px}
  .kind{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;padding:1px 6px;
    border-radius:8px;margin-left:6px;background:#22262F;color:var(--dim)}
  .kind.insight{background:#12301C;color:#81C995}
  .kind.blocker{background:#3A1614;color:#F28B82}
  .kind.build{background:#332600;color:#FDD663}
  .kind.question,.kind.answer{background:#12233A;color:#8AB4F8}
  .facts li{margin:5px 0;font-size:12.5px;color:#C7CBD1}
  .facts{margin:0;padding-left:16px}
  .node{cursor:pointer}
  .node rect{transition:filter .12s}
  .node:hover rect{filter:brightness(1.35)}
  .node.sel rect{stroke:#fff;stroke-width:2.5}
  .ready{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.95}}
  .empty{color:var(--dim);padding:28px;text-align:center;font-size:13px}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer}
  button:hover{border-color:#3C4350}
  button.up:hover{border-color:var(--done);color:#81C995}
  button.down:hover{border-color:var(--blocked);color:#F28B82}
  .crit{color:#C7CBD1;font-size:12.5px;margin:6px 0 10px}
  .tool{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;
    font-size:12.5px}
  .tool .t{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.7px}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--dim);padding:0 24px 10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Challenge Accepted</h1>
    <select id="picker" title="Choose a challenge"></select>
    <span class="tag" id="outcome"></span>
    <div class="counts">
      <span><b id="c-done">0</b>/<b id="c-nodes">0</b> steps</span>
      <span><b id="c-tools">0</b> tools built</span>
      <span id="live" style="color:var(--done)">&#9679; live</span>
    </div>
  </header>

  <main>
    <div class="legend">
      <span><i class="dot" style="background:var(--todo)"></i>to do</span>
      <span><i class="dot" style="background:var(--active)"></i>active</span>
      <span><i class="dot" style="background:var(--done)"></i>done</span>
      <span><i class="dot" style="background:var(--blocked)"></i>blocked</span>
      <span style="margin-left:auto">click a step for detail</span>
    </div>
    <div id="graph"></div>
  </main>

  <aside>
    <div class="sect">
      <h2>Group intelligence</h2>
      <ul class="facts" id="facts"><li class="tag">Nothing learned yet.</li></ul>
    </div>
    <div class="sect" id="detail-wrap" style="display:none">
      <h2>Step detail</h2>
      <div id="detail"></div>
    </div>
    <div class="sect" style="border-bottom:0;padding-bottom:6px">
      <h2>Journal &mdash; what the agents noticed</h2>
    </div>
    <div id="journal"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const COLOR = {todo:'#5F6368', active:'#4285F4', blocked:'#EA4335',
               done:'#34A853', superseded:'#DADCE0'};
let challengeId = new URLSearchParams(location.search).get('id');
let selected = null;
let lastJournalCount = -1;

const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

async function pickChallenge() {
  const {challenges} = await api('/challenges');
  const picker = $('picker');
  picker.innerHTML = challenges.map(c =>
    `<option value="${esc(c.id)}">${esc(c.title)} (${c.nodes} steps)</option>`).join('');
  if (!challenges.length) return false;
  if (!challengeId || !challenges.some(c => c.id === challengeId)) {
    challengeId = challenges[0].id;
  }
  picker.value = challengeId;
  picker.onchange = () => {
    challengeId = picker.value; selected = null; lastJournalCount = -1; refresh();
  };
  return true;
}

// Curved edge, drawn left-to-right so the dependency direction reads at a glance.
function edgePath(a, b) {
  const x1 = a.x + 220, y1 = a.y + 32, x2 = b.x, y2 = b.y + 32;
  const mid = (x1 + x2) / 2;
  return `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
}

function drawGraph(graph) {
  if (!graph.nodes.length) {
    $('graph').innerHTML = '<div class="empty">No steps yet. Start a challenge in the '
      + 'agent UI, then this fills in.</div>';
    return;
  }
  const pos = {};
  graph.nodes.forEach(n => pos[n.id] = n.position);
  const W = Math.max(...graph.nodes.map(n => n.position.x)) + 300;
  const H = Math.max(...graph.nodes.map(n => n.position.y)) + 120;

  const edges = graph.edges.map(e => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return '';
    return `<path d="${edgePath(a,b)}" fill="none" stroke="#2C323D" stroke-width="1.6"
             marker-end="url(#arrow)"/>`;
  }).join('');

  const nodes = graph.nodes.map(n => {
    const d = n.data, sel = n.id === selected ? ' sel' : '';
    const label = d.label.length > 30 ? d.label.slice(0, 29) + '…' : d.label;
    const toolBadge = d.tools.length
      ? `<circle cx="206" cy="14" r="8" fill="#F9AB00"/>
         <text x="206" y="18" text-anchor="middle" font-size="10" font-weight="700"
               fill="#1A1A1A">${d.tools.length}</text>` : '';
    const readyRing = d.ready
      ? `<rect class="ready" x="-3" y="-3" width="226" height="70" rx="10" fill="none"
             stroke="#4285F4" stroke-width="2"/>` : '';
    return `<g class="node${sel}" transform="translate(${n.position.x},${n.position.y})"
              data-id="${esc(n.id)}">
        ${readyRing}
        <rect width="220" height="64" rx="8" fill="#171A21" stroke="${d.color}"
              stroke-width="1.6"/>
        <rect width="4" height="64" rx="2" fill="${d.color}"/>
        <text x="14" y="25" font-size="12.5" font-weight="600" fill="#E8EAED">${esc(label)}</text>
        <text x="14" y="44" font-size="10.5" fill="#9AA0A6">${esc(d.status)}${
          d.effort_mins ? ' · ' + d.effort_mins + 'm' : ''}</text>
        ${toolBadge}
      </g>`;
  }).join('');

  $('graph').innerHTML = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
      <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
             markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2C323D"/>
      </marker></defs>${edges}${nodes}</svg>`;

  $('graph').querySelectorAll('.node').forEach(g => {
    g.onclick = () => {
      selected = g.dataset.id;
      showDetail(graph.nodes.find(n => n.id === selected));
      drawGraph(graph);
    };
  });
}

function showDetail(node) {
  if (!node) return;
  const d = node.data;
  $('detail-wrap').style.display = 'block';
  $('detail').innerHTML = `
    <div style="font-weight:600;margin-bottom:2px">${esc(d.label)}</div>
    <div class="tag">${esc(d.status)}${d.assignee ? ' · ' + esc(d.assignee) : ''}</div>
    <div class="crit"><b>Done when:</b> ${esc(d.acceptance_criteria)}</div>
    ${d.evidence?.length ? `<div class="crit"><b>Evidence:</b> ${
      d.evidence.map(esc).join('; ')}</div>` : ''}
    ${d.tools.map(t => `<div class="tool">
        <div class="t">${esc(t.type)}${t.degraded ? ' · degraded' : ''}</div>
        <div>${esc(t.name)}</div>
        <div style="margin-top:7px;display:flex;gap:6px">
          <button class="up"   data-fb="up"   data-t="${esc(t.id)}">&#128077; helpful</button>
          <button class="down" data-fb="down" data-t="${esc(t.id)}">&#128078; not useful</button>
        </div>
      </div>`).join('') || '<div class="tag">No tool needed for this step.</div>'}`;

  $('detail').querySelectorAll('[data-fb]').forEach(b => {
    b.onclick = async () => {
      const reason = prompt('One line on why (optional):') || '';
      await api(`/challenges/${challengeId}/feedback`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target_type: 'tool', target_id: b.dataset.t,
                              verdict: b.dataset.fb, reason}),
      });
      b.textContent = 'recorded ✓';
      b.disabled = true;
    };
  });
}

function drawJournal(entries) {
  if (entries.length === lastJournalCount) return;   // avoid clobbering scroll
  lastJournalCount = entries.length;
  const el = $('journal');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
  el.innerHTML = entries.map(e => `<div class="entry">
      <span class="who">${esc(e.actor)}</span>
      <span class="kind ${esc(e.kind)}">${esc(e.kind)}</span>
      <div>${esc(e.text)}</div></div>`).join('')
    || '<div class="tag">No notes yet.</div>';
  if (stick) el.scrollTop = el.scrollHeight;
}

async function refresh() {
  try {
    if (!challengeId && !(await pickChallenge())) {
      $('graph').innerHTML = '<div class="empty">No challenges yet. Run '
        + '<code>adk web</code> or <code>scripts\\live_walk.py</code> to create one.</div>';
      return;
    }
    const [summary, graph, journal] = await Promise.all([
      api(`/challenges/${challengeId}`),
      api(`/challenges/${challengeId}/graph`),
      api(`/challenges/${challengeId}/journal`),
    ]);
    $('outcome').textContent = summary.charter.outcome || '';
    $('c-done').textContent = summary.counts.done;
    $('c-nodes').textContent = summary.counts.nodes;
    $('c-tools').textContent = summary.counts.tools;
    $('facts').innerHTML = summary.group_facts.length
      ? summary.group_facts.map(f => `<li>${esc(f)}</li>`).join('')
      : '<li class="tag">Nothing learned yet.</li>';
    drawGraph(graph);
    drawJournal(journal.entries);
    if (selected) showDetail(graph.nodes.find(n => n.id === selected));
    $('live').style.color = 'var(--done)';
  } catch (err) {
    $('live').style.color = 'var(--blocked)';
    console.error(err);
  }
}

pickChallenge().then(refresh);
setInterval(refresh, 3000);
</script>
</body>
</html>
