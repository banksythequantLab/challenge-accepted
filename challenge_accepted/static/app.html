<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenge Accepted</title>
<style>
  :root{
    --bg:#0B0D12; --panel:#12151D; --panel2:#171B25; --line:#232838;
    /* --faint was #5A6274, which measured 3.18:1 against the panels -- below WCAG AA's
       4.5:1 for body text, and it carries the stat labels, the map legend and the
       roster. Unreadable on a projector, which is exactly where a hackathon demo gets
       seen. #828A9E measures 4.98-5.63:1 across all three backgrounds.
       scripts\check_a11y.py computes this from the rendered colours, not the CSS. */
    --ink:#EDEFF3; --dim:#8B93A7; --faint:#828A9E;
    --todo:#6B7385; --active:#4C8DFF; --blocked:#FF5C5C; --done:#3DD68C;
    --gold:#FFC24B; --violet:#A78BFA;
    --glow:0 0 24px rgba(76,141,255,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(76,141,255,.10), transparent 60%),
      radial-gradient(800px 480px at 92% 6%, rgba(167,139,250,.09), transparent 62%),
      radial-gradient(700px 500px at 60% 110%, rgba(61,214,140,.06), transparent 60%)}
  #app{position:relative;z-index:1;display:grid;grid-template-columns:1fr 420px;
    grid-template-rows:auto 1fr;height:100%}

  header{grid-column:1/-1;padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(255,255,255,.03),transparent)}
  .logo{font-size:16px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(92deg,#7FB2FF,#A78BFA 55%,#FFC24B);
    -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  #title{font-size:14px;font-weight:650;color:var(--ink);
    max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #title.empty{color:var(--faint);font-weight:400;font-style:italic}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px}
  .stats{margin-left:auto;display:flex;align-items:center;gap:16px}
  .stat{text-align:right;line-height:1.15}
  .stat b{display:block;font-size:15px;font-weight:700}
  .stat span{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint)}
  .xpwrap{width:150px}
  .xpbar{height:7px;border-radius:99px;background:#1C2130;overflow:hidden;margin-top:5px;
    border:1px solid var(--line)}
  .xpfill{height:100%;width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg,#3DD68C,#7FB2FF)}
  #live{font-size:10px;color:var(--done)}

  main{position:relative;overflow:auto;padding:16px 20px 26px}
  .maphead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .maphead h2{margin:0;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--dim);font-weight:700}
  .legend{display:flex;gap:12px;font-size:10.5px;color:var(--faint);margin-left:auto}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}

  aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
  /* THE GRID MIN-CONTENT TRAP, and the reason the tab row hung off a 320px screen.
     A grid item's default `min-width` is `auto`, meaning "never shrink below my
     content". The quest map is a 1980px SVG, so on a 320px phone the column refused
     to go below 324px and every child inherited that width -- header, main, aside and
     the tab row alike. `#app` clips the overflow, so the page never scrolled sideways
     and nothing looked wrong; the last tab was simply 4px off-screen and unreachable.
     Measured: innerWidth 320, #app 320, but header/main/aside/tabs all 324.
     `min-width:0` is what actually lets a grid child obey its column. */
  #app > *{min-width:0}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex:none;min-width:0}
  /* `flex:1` alone does not let a flex item shrink below its content width, so at
     320px the four uppercase labels plus padding and letter-spacing overflowed the
     row and the last tab sat 4px off-screen -- unreachable, on the narrowest phones
     still in use. `min-width:0` is what actually permits the shrink; the ellipsis is
     the graceful end of it. Found by check_devices.py on a Galaxy S9+. */
  .tab{flex:1 1 0;min-width:0;padding:10px 6px;text-align:center;font-size:11px;
    font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);
    cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Below this the labels start truncating; buy the room back from the tracking,
     which is decorative, rather than from the words, which are not. */
  @media (max-width:360px){
    .tab{letter-spacing:.2px;padding:10px 3px}
  }
  .tab.on{color:var(--ink);border-bottom-color:var(--active)}
  .pane{display:none;flex:1;min-height:0;flex-direction:column}
  .pane.on{display:flex}

  #chatlog{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:94%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap;
    word-wrap:break-word;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,#2A5BB8,#3A6FD8);
    border:1px solid #4C8DFF44}
  .msg.bot{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .msg .who{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;
    color:var(--dim);margin-bottom:3px;font-weight:700}
  .msg .body b.h{display:block;margin:9px 0 3px;font-size:11px;letter-spacing:.7px;
    text-transform:uppercase;color:var(--violet)}
  .msg .body b.h:first-child{margin-top:0}
  .msg .body code{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
    background:rgba(255,255,255,.07);border-radius:4px;padding:1px 5px}
  .msg.act{align-self:flex-start;background:transparent;border:1px dashed var(--line);
    color:var(--dim);font-size:11.5px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:5px;height:5px;border-radius:50%;background:var(--dim);
    animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .composer{flex:none;border-top:1px solid var(--line);padding:12px;
    display:flex;gap:8px;align-items:flex-end;background:rgba(0,0,0,.25)}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;
    font-size:13px;max-height:120px;min-height:42px}
  textarea:focus{outline:none;border-color:var(--active);box-shadow:var(--glow)}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;
    transition:.15s}
  button:hover:not(:disabled){border-color:var(--active);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .send{background:linear-gradient(135deg,#3A6FD8,#4C8DFF);border-color:#4C8DFF66}

  #journal{flex:1;overflow-y:auto;padding:12px 16px}
  .entry{padding:8px 0;border-bottom:1px solid #1A1E29;font-size:12.5px}
  .entry:last-child{border-bottom:0}
  .who2{font-weight:700;font-size:11px}
  .kind{font-size:9px;text-transform:uppercase;letter-spacing:.8px;padding:2px 7px;
    border-radius:99px;margin-left:6px;background:#1E2432;color:var(--dim)}
  .kind.insight{background:#0F2E1F;color:#7DE0AC}
  .kind.blocker{background:#331416;color:#FF8A8A}
  .kind.build{background:#332708;color:#FFD27A}
  .kind.question,.kind.answer{background:#122540;color:#8FBBFF}
  /* The parallel-build rail. Hidden until a worker speaks, so it never sits empty. */
  #forge{display:none}
  #forge.on{display:grid;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,194,75,.06),transparent)}
  .lane{display:flex;align-items:center;gap:9px;font-size:11.5px}
  .lane b{color:var(--gold);font-weight:700;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;min-width:88px}
  .lane .what{color:var(--dim)}
  .lane::after{content:'';flex:1;height:3px;border-radius:99px;
    background:linear-gradient(90deg,var(--gold),rgba(255,194,75,.15));
    animation:pulse 1.1s ease-in-out infinite}
  .lane.done .what{color:var(--done)}
  .lane.done::after{background:var(--done);animation:none}
  .lane.bad .what{color:var(--blocked)}
  .lane.bad::after{background:var(--blocked)}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  .byline{color:var(--gold);font-weight:700;margin-right:7px;
    font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}

  /* A failed run is not a status code. It needs to say what happened, whether any of
     it stuck, and offer the way forward. */
  .msg.act.err{border-color:var(--blocked);border-style:solid;color:#FFC9C9;
    max-width:100%;font-family:inherit;font-size:12.5px;padding:10px 12px}
  .msg.act.err .wait{display:block;color:var(--dim);margin:6px 0 9px;font-size:11.5px}
  .msg.act.err button{font-size:12px}

  .why{display:flex;gap:6px;margin-top:8px}
  .why input{flex:1;min-width:0;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;
    font-size:12px}
  .why input:focus{outline:none;border-color:var(--gold)}
  .why.done{display:block;font-size:12px;color:var(--done);margin-top:8px}
  .why .wait{font-size:12px;color:var(--dim)}
  .partybar{display:flex;align-items:center;gap:10px;padding:10px 14px;
            border-bottom:1px solid var(--line)}
  .roster{font-size:11.5px;color:var(--dim);line-height:1.4;flex:1}
  .roster b{color:var(--ink)}
  .facts{margin:0;padding:12px 16px 12px 30px}
  .facts li{margin:6px 0;font-size:12.5px;color:#C3CAD8}

  .quest{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 16px;
    background:var(--panel2)}
  .quest h3{margin:0 0 4px;font-size:14px}
  .crit{color:#C3CAD8;font-size:12.5px;margin:8px 0}
  .tool{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:8px 0;
    background:rgba(255,194,75,.05);font-size:12.5px}
  .tool .t{font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.9px;
    font-weight:700}
  .row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .empty{color:var(--faint);padding:36px 20px;text-align:center;font-size:13px;line-height:1.7}
  .empty b{color:var(--dim)}

  /* Copy affordances. The point of this app is that you take the instructions
     somewhere else and act on them -- usually into Claude. Make that one click. */
  .copy{position:absolute;top:5px;right:5px;padding:3px 8px;font-size:10px;font-weight:700;
    letter-spacing:.6px;text-transform:uppercase;border-radius:7px;opacity:0;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    transition:opacity .15s,color .15s,border-color .15s}
  .msg{position:relative}
  .msg:hover .copy,.copy:focus{opacity:1}
  .copy.done{opacity:1;color:var(--done);border-color:var(--done)}
  /* Reveal-on-hover hides the button forever on a touch screen, which is exactly
     where copying into another app matters most. Keep it visible there -- but a
     permanently-visible button floating over the first line of every message covers
     the words it is offering to copy. Reserve room for it instead. */
  @media (hover:none){
    .copy{opacity:.75}
    .msg.bot{padding-right:62px}

    /* iOS Safari zooms the whole page when you focus an input under 16px, and does
       not zoom back out. This rule used to live in the 820px block, where the width
       was standing in for "phone". It is the wrong axis: an iPad in landscape is
       1024px AND a touch device, so it fell through and got the 13px desktop
       composer -- tap the chat box on the most likely tablet at a demo and you are
       stranded at 1.3x with the layout hanging off the right edge. The real condition
       is "this device raises a touch keyboard", which is exactly what hover:none
       means. Found by check_devices.py at 1024px, a width nothing had ever rendered. */
    #input, .why input{font-size:16px}

    /* 16px is non-negotiable above, but it costs width: on a 320px screen the composer
       is 182px, so the placeholder wraps to two lines inside a one-line box and the
       user is greeted by a sentence cut in half. Measured need is 70px of content;
       46px was a guess and left it still clipped. Two full lines, which is what every
       messaging app on a phone gives you anyway. Caught by the screenshots -- every
       numeric assertion passed while this was on screen. */
    #input{min-height:72px}
  }
  .ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
    font-size:11.5px;padding:7px 11px}
  .claude{background:linear-gradient(135deg,#7A4B2A,#C1683A);border-color:#C1683A88;color:#fff}

  .node{cursor:pointer}
  /* A focus ring you can actually see on a dark map. `outline` does not render
     reliably on an SVG <g> across browsers, so draw it. */
  .node:focus{outline:none}
  .node:focus rect.card{stroke:var(--gold);stroke-width:3;filter:brightness(1.3)}
  .node rect.card{transition:filter .15s}
  .node:hover rect.card{filter:brightness(1.4)}
  .node.sel rect.card{stroke-width:2.5}
  .ready{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
  /* The tool viewer. A tool you cannot open is a screenshot of a tool. */
  #modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(6,8,12,.78);
    backdrop-filter:blur(3px);padding:32px}
  #modal.on{display:flex;align-items:center;justify-content:center}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;
    box-shadow:0 24px 80px rgba(0,0,0,.6);animation:rise .2s ease}
  .sheet header{display:flex;align-items:center;gap:12px;padding:16px 20px;
    border-bottom:1px solid var(--line);flex:none;background:none}
  .sheet h2{margin:0;font-size:16px;font-weight:700}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    padding:3px 9px;border-radius:99px;background:rgba(255,194,75,.13);color:var(--gold);
    border:1px solid rgba(255,194,75,.3)}
  .badge.warn{background:rgba(255,92,92,.12);color:var(--blocked);
    border-color:rgba(255,92,92,.35)}
  .badge.ok{background:rgba(61,214,140,.12);color:var(--done);
    border-color:rgba(61,214,140,.35)}
  .sheet .usage{padding:14px 20px;color:#C3CAD8;font-size:13px;line-height:1.6;
    border-bottom:1px solid var(--line);flex:none}
  .sheet .stage{flex:1;min-height:0;overflow:auto;padding:0}
  .sheet footer{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);
    flex:none;flex-wrap:wrap}
  .sheet footer .spacer{margin-left:auto}
  #frame{width:100%;height:min(60vh,540px);border:0;background:#fff;display:block}
  pre.src{margin:0;padding:18px 20px;font-family:ui-monospace,Consolas,monospace;
    font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
    color:#C9D2E3}
  .check{display:flex;gap:11px;align-items:flex-start;padding:11px 20px;
    border-bottom:1px solid #1A1E29;cursor:pointer;font-size:13.5px}
  .check:last-child{border-bottom:0}
  .check input{margin:2px 0 0;width:16px;height:16px;accent-color:#3DD68C;flex:none}
  .check.done span{text-decoration:line-through;color:var(--faint)}
  .check .note{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  .sheet .empty{padding:28px 20px}

  /* Phone: stack the map above the panel instead of crushing it into a sliver.
     You scanned a QR to get here; the copy buttons have to be reachable. */
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 38vh 1fr}
    aside{border-left:0;border-top:1px solid var(--line)}
    header{padding:10px 14px;gap:10px}
    #title{max-width:100%;flex-basis:100%;order:9}
    .stats{gap:12px}
    .xpwrap{width:110px}
    main{padding:12px 14px 18px}

    /* The 16px input rule that used to live here now sits in the `hover:none` block
       above, because width was the wrong axis -- see the comment there. */

    /* Fingers are not cursors. Invite was a 30px target. */
    button{min-height:36px}
    /* Height via line-height, NOT display:flex. Making the tab a flex container turns
       its label into an anonymous flex item, which `text-overflow:ellipsis` cannot
       touch and `min-width:0` cannot reach -- so the shrink rule above silently stopped
       applying at exactly the widths that need it, and the last tab stayed 4px
       off-screen on a 320px phone. The centring is worth one line; it is not worth
       breaking the only mechanism keeping the row inside the viewport. */
    .tab{min-height:40px;line-height:20px}
  }

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242A38;border-radius:99px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">CHALLENGE ACCEPTED</div>
    <select id="picker" title="Choose a challenge"></select>
    <div id="title" class="empty">no quest yet — say what you want to make happen</div>
    <div class="stats">
      <div class="stat xpwrap">
        <b><span id="c-done">0</span> / <span id="c-nodes">0</span></b>
        <span>quests cleared</span>
        <div class="xpbar"><div class="xpfill" id="xp"></div></div>
      </div>
      <div class="stat"><b id="c-tools">0</b><span>tools forged</span></div>
      <div class="stat"><b id="c-party">1</b><span>in party</span></div>
      <div class="stat"><b id="live">●</b><span>live</span></div>
    </div>
  </header>

  <main>
    <div class="maphead">
      <h2>Quest Map</h2>
      <div class="legend">
        <span><i class="dot" style="background:var(--todo)"></i>locked</span>
        <span><i class="dot" style="background:var(--active)"></i>ready</span>
        <span><i class="dot" style="background:var(--done)"></i>cleared</span>
        <span><i class="dot" style="background:var(--blocked)"></i>blocked</span>
      </div>
    </div>
    <div id="graph"></div>
  </main>

  <aside>
    <div class="tabs">
      <div class="tab on" data-p="chat">Talk</div>
      <div class="tab" data-p="quest">Quest</div>
      <div class="tab" data-p="journal">Journal</div>
      <div class="tab" data-p="facts">Party</div>
    </div>

    <div class="pane on" id="p-chat">
      <div id="forge"></div>
      <div id="chatlog"></div>
      <div class="composer">
        <!-- The placeholder used to carry a second line -- "Shift+Enter for a new
             line" -- separated by &#10;. The textarea is rows="1", so that hint has
             never been visible on any device, at any width, since it was written: the
             box is one line tall and the text was on line two. It was also advice for
             a keyboard, offered to phones. It lives in `title` now, where a pointer
             user can actually find it. -->
        <textarea id="input" rows="1" title="Shift+Enter for a new line"
          placeholder="What do you want to make happen?"></textarea>
        <button class="ghost" id="copyall"
                title="Copy the whole conversation as markdown">⧉</button>
        <button class="send" id="send">Send</button>
      </div>
    </div>

    <div class="pane" id="p-quest"><div id="detail" class="empty">Pick a quest on the map.</div></div>
    <div class="pane" id="p-journal"><div id="journal"></div></div>
    <div class="pane" id="p-facts">
      <div class="partybar">
        <div id="roster" class="roster">Just you so far.</div>
        <button class="ghost" id="invite"
                title="Copy a link that drops a teammate into this same quest">Invite ⧉</button>
      </div>
      <ul class="facts" id="facts"></ul>
    </div>
  </aside>
</div>

<div id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <header>
      <h2 id="m-name"></h2>
      <span class="badge" id="m-type"></span>
      <span class="badge" id="m-smoke"></span>
      <button class="ghost" id="m-close" style="margin-left:auto">Close</button>
    </header>
    <div class="usage" id="m-usage"></div>
    <div class="stage" id="m-stage"></div>
    <footer>
      <button class="ghost" id="m-copy">Copy tool</button>
      <button class="ghost" id="m-download">Download</button>
      <span class="spacer"></span>
      <button class="claude" id="m-claude">Copy for Claude</button>
    </footer>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const APP_NAME = "challenge_accepted";
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let userId = localStorage.getItem('ca_user') ||
             ('u_' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('ca_user', userId);
let groupId = localStorage.getItem('ca_group') || ('grp_' + userId);
localStorage.setItem('ca_group', groupId);

let sessionId = null;
let challengeId = new URLSearchParams(location.search).get('id');
let selected = null, lastJournal = -1, busy = false;
//: Kept around so "Copy for Claude" can package a step with the goal it serves and
//: the full source of any tool built for it -- the graph endpoint only carries stubs.
let charter = {}, groupFacts = [], toolsById = {};

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(p =>
    p.classList.toggle('on', p.id === 'p-' + t.dataset.p));
});

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) throw new Error(path + ' -> ' + r.status);
  return r.json();
}

// The agents write markdown -- they are LLMs, that is what they do. Rendering the
// common subset beats showing the user literal ### and **. Everything is escaped
// first, so nothing here can inject markup.
function md(text) {
  return esc(text)
    .replace(/^#{1,6}\s*(.+)$/gm, '<b class="h">$1</b>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^\s*[-*]\s+/gm, '• ');
}

// navigator.clipboard needs a secure context. Cloud Run is HTTPS and localhost counts,
// but a plain-http LAN test would silently fail, so fall back to a throwaway textarea.
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const t = document.createElement('textarea');
    t.value = text;
    t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); } finally { t.remove(); }
  }
  if (!btn) return;
  const was = btn.textContent;
  btn.textContent = 'Copied ✓';
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = was; btn.classList.remove('done'); }, 1600);
}

//: Copies the RAW markdown the agent wrote, not the rendered HTML -- pasting
//: `### Step 1` into Claude is far more useful than pasting a styled <b>.
function addCopy(node, getText) {
  const b = document.createElement('button');
  b.className = 'copy';
  b.textContent = 'Copy';
  b.title = 'Copy this as markdown, ready to paste into Claude';
  b.onclick = e => { e.stopPropagation(); copyText(getText(), b); };
  node.appendChild(b);
}

function bubble(cls, who, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = (who ? `<div class="who">${esc(who)}</div>` : '') +
                `<div class="body">${md(text)}</div>`;
  d._raw = text;
  if (cls === 'bot' && text) addCopy(d, () => d._raw);
  $('chatlog').appendChild(d);
  $('chatlog').scrollTop = $('chatlog').scrollHeight;
  return d;
}

//: Streamed chunks have to re-render the whole bubble -- markdown spans arrive split.
function appendText(node, text) {
  node._raw = (node._raw || '') + text;
  node.querySelector('.body').innerHTML = md(node._raw);
}

// POST /apps/{a}/users/{u}/sessions -- NOT .../sessions/{id}.
//
// The by-id endpoint is deprecated in ADK and, more to the point, it declares
// `state: Optional[dict]` as a bare body parameter: the WHOLE BODY is the state. We
// were posting {state:{...}} to it, which FastAPI happily accepted and stored as a
// session whose state was literally {"state": {...}}. Nothing errored. Every read of
// tool_context.state["challenge_id"] and ["user_id"] then quietly missed, so:
//   * every challenge created from this dashboard was owned by "anon" in "grp_anon",
//   * a teammate opening an invite link resolved to their own private group,
//   * the Warden never learned a challenge was already in flight and re-interviewed
//     people about a goal that was drawn on the screen behind the chat panel.
// Three separate mysteries, one silently-accepted request shape.
//
// The plural endpoint takes CreateSessionRequest{session_id, state, events}, so the
// wrapping is explicit and a mismatch is a validation error rather than a shrug.
async function ensureSession(force) {
  if (sessionId && !force) return sessionId;
  const wanted = 's_' + Math.random().toString(36).slice(2, 10);
  const state = { user_id: userId, group_id: groupId };
  if (challengeId) state.challenge_id = challengeId;
  const r = await fetch(`/apps/${APP_NAME}/users/${userId}/sessions`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ session_id: wanted, state }),
  });
  if (!r.ok) throw new Error('session create failed: ' + r.status);
  // Trust the server's id rather than assuming it honoured ours.
  const created = await r.json();
  sessionId = created.id || wanted;
  return sessionId;
}

// Sessions live in server memory until an Agent Engine backs them, so a Cloud Run
// restart leaves this browser holding a sessionId the server has never heard of.
// Without this, every send after a restart fails and the user has no idea that
// reloading would fix it. Rebuild the session and retry once.
async function startRun(text) {
  const post = () => fetch('/run_sse', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      appName: APP_NAME, userId, sessionId, streaming: false,
      newMessage: { role: 'user', parts: [{ text }] },
    }),
  });

  await ensureSession();
  let res = await post();
  if (!res.ok) {
    await ensureSession(true);
    res = await post();
  }
  if (!res.ok) throw new Error('run_sse ' + res.status);
  return res;
}

//: Only suppress a worker whose ENTIRE turn is the idle signal. A worker that says
//: "idle" inside a sentence about a tool it built is saying something.
const isIdleChatter = (author, text) =>
  /^toolwright_\d+$/.test(author || '') && /^\W*idle\W*$/i.test(text.trim());

//: An action chip, tagged with the agent that took it.
function act(author, text) {
  const d = bubble('act', null, text);
  if (author) {
    const who = document.createElement('span');
    who.className = 'byline';
    who.textContent = author;
    d.querySelector('.body').prepend(who);
  }
  return d;
}

// ------------------------------------------------------------------ forge rail
// FORGE is the claim: N tools built CONCURRENTLY by N workers, each writing code,
// running it, and refusing to ship until its own smoke test passes. In the chat that
// arrives as an interleaved column of chips, which reads as one agent thrashing.
// The rail draws a lane per worker so the parallelism is a shape rather than a claim.
const forge = {
  lanes: new Map(),

  reset() {
    this.lanes.clear();
    $('forge').innerHTML = '';
    $('forge').classList.remove('on');
  },

  //: Worker agents are named toolwright_0..K-1 by sub_agents/forge.py. Anything else
  //: is a coordinator and does not get a lane.
  saw(author, part) {
    const m = /^toolwright_(\d+)$/.exec(author || '');
    if (!m) return;
    const n = m[1];
    let lane = this.lanes.get(n);
    if (!lane) {
      lane = { el: document.createElement('div'), state: 'working' };
      lane.el.className = 'lane';
      lane.el.innerHTML = `<b>toolwright ${n}</b><span class="what">starting…</span>`;
      $('forge').appendChild(lane.el);
      $('forge').classList.add('on');
      this.lanes.set(n, lane);
      // Order lanes by worker number, not by whoever spoke first -- otherwise they
      // reshuffle on screen every run and look like a bug.
      [...$('forge').children]
        .sort((a, b) => a.querySelector('b').textContent
                         .localeCompare(b.querySelector('b').textContent))
        .forEach(el => $('forge').appendChild(el));
    }

    const what = lane.el.querySelector('.what');
    if (part.executableCode) { what.textContent = 'writing code'; }
    else if (part.codeExecutionResult) {
      const ok = !/FAIL/i.test(part.codeExecutionResult.outcome || '');
      what.textContent = ok ? 'smoke test passed' : 'failed — retrying';
      lane.el.classList.toggle('bad', !ok);
    }
    else if (part.functionCall?.name === 'save_tool') {
      what.textContent = 'shipped ✓';
      lane.el.classList.remove('bad');
      lane.el.classList.add('done');
      lane.state = 'done';
    }
    else if (part.text?.trim() && lane.state !== 'done') {
      what.textContent = /idle/i.test(part.text) ? 'idle' : 'thinking';
    }
  },
};

// Streams /run_sse and renders each agent event as it arrives.
//: `retryText` re-sends a turn that failed, without making the user retype the message
//: they watched vanish into the transcript.
async function send(retryText) {
  // Belt as well as braces: anything that is not a string is not a retry. Wiring this
  // straight to an onclick hands it a MouseEvent, and `.trim()` on that is a TypeError
  // that eats the whole turn -- including the error handler meant to report it.
  const text = (typeof retryText === 'string' ? retryText : $('input').value).trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true;
  if (typeof retryText !== 'string') { $('input').value = ''; $('input').style.height = 'auto'; }
  bubble('me', null, text);
  forge.reset();
  //: Did ANY agent event arrive before it broke? That is the difference between
  //: "nothing happened" and "some of it did and is on the map".
  let streamed = false;

  const thinking = bubble('bot', 'working',
    '');
  thinking.querySelector('.who').insertAdjacentHTML('afterend',
    '<span class="typing"><i></i><i></i><i></i></span>');

  try {
    const res = await startRun(text);
    thinking.remove();
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', lastAuthor = null, node = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const chunk of parts) {
        const line = chunk.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        streamed = true;
        for (const p of (ev.content?.parts || [])) {
          // An empty Toolwright slot is instructed to say "idle" and stop. That is the
          // right thing for the agent to do and the wrong thing to put on screen: the
          // loop runs several passes over four slots, so a real FORGE turn buries the
          // actual work under a stack of bubbles that say nothing. The rail already
          // shows the slot as idle, which is where that information belongs.
          if (p.text?.trim() && !isIdleChatter(ev.author, p.text)) {
            if (ev.author !== lastAuthor) { node = null; lastAuthor = ev.author; }
            if (!node) node = bubble('bot', ev.author, p.text.trim());
            else appendText(node, p.text);
            $('chatlog').scrollTop = $('chatlog').scrollHeight;
          }
          // Attribute every action. Four Toolwrights building in parallel used to
          // render as an anonymous column of "writing code..." -- the single most
          // impressive thing the system does, displayed as if one agent were stuttering.
          if (p.functionCall) act(ev.author, '⚙ ' + p.functionCall.name);
          if (p.executableCode) act(ev.author, '⌨ writing code…');
          if (p.codeExecutionResult) act(ev.author, '▶ ran it: ' +
            (p.codeExecutionResult.outcome || '').replace('Outcome.', ''));
          forge.saw(ev.author, p);
        }
      }
    }
    // relist: the turn may have created a quest that is not in the picker yet. This is
    // the moment we learn that, which is why the poll does not have to keep asking.
    await adoptChallengeFromSession();
    await refresh(true);
  } catch (e) {
    thinking.remove();
    showFailure(e, text, streamed);
  } finally {
    busy = false; $('send').disabled = false; $('input').focus();
  }
}

// ------------------------------------------------------------------- failures
// A run WILL fail during a seven-week judging window: Gemini rate-limits, Cloud Run
// recycles, wifi drops. What the user got before was a dashed chip reading
// "run_sse 429" -- a status code, no idea whether their work survived, and no way
// forward but retyping the message they just watched disappear.

//: Say what happened, in a sentence a person can act on.
function explainError(e) {
  const m = String(e && e.message || e);
  const code = (m.match(/\b(4\d\d|5\d\d)\b/) || [])[1];
  if (code === '429')
    return "Gemini is rate-limiting us. Give it a few seconds, then try again.";
  if (code === '401' || code === '403')
    return "The server refused the request. If this is the deployed app, its "
         + "credentials may have expired.";
  if (code && code.startsWith('5'))
    return "The server errored out.";
  if (/failed to fetch|networkerror|load failed|network error/i.test(m))
    return "Lost the connection to the server.";
  return m;
}

//: `streamed` says whether any agent event arrived before it broke. That is the
//: difference between "nothing happened" and "some of it happened and is on the map",
//: and it is the first thing a person wants to know.
function showFailure(e, text, streamed) {
  const d = bubble('act', null, '');
  d.classList.add('err');
  const body = d.querySelector('.body');
  body.textContent = '✖ ' + explainError(e) + ' ';
  const note = document.createElement('div');
  note.className = 'wait';
  note.textContent = streamed
    ? 'The agents had started — whatever they saved is on the map. The rest did not happen.'
    : 'Nothing was saved, so nothing is half-done.';
  body.appendChild(note);

  const again = document.createElement('button');
  again.className = 'send';
  again.id = 'retry';
  again.textContent = 'Try again';
  again.onclick = () => { again.disabled = true; send(text); };
  body.appendChild(again);
  $('chatlog').scrollTop = $('chatlog').scrollHeight;
}

// The Interviewer writes challenge_id into session state once the charter is saved.
// Pick it up so the header, map and journal bind to the new quest automatically.
async function adoptChallengeFromSession() {
  try {
    const r = await fetch(`/apps/${APP_NAME}/users/${userId}/sessions/${sessionId}`);
    if (!r.ok) return;
    const s = await r.json();
    const cid = s?.state?.challenge_id;
    if (cid && cid !== challengeId) {
      challengeId = cid; lastJournal = -1;
      rememberChallenge(cid);
      history.replaceState(null, '', '?id=' + cid);
    }
  } catch {}
}

// Whole transcript as markdown. Tool-call chips are dropped -- they are UI chrome,
// not something you want cluttering a paste into Claude.
$('copyall').onclick = () => {
  const out = [...document.querySelectorAll('#chatlog .msg')]
    .filter(m => !m.classList.contains('act'))
    .map(m => (m.classList.contains('me') ? '## Me' : '## ' +
      (m.querySelector('.who')?.textContent || 'Agent')) + '\n' + (m._raw || ''));
  const head = charter.title || charter.outcome;
  copyText((head ? `# ${head}\n\n` : '') + out.join('\n\n'), $('copyall'));
};

//: NOT `= send`. An onclick handler is called with the MouseEvent, which would arrive
//: as send()'s retry-text argument and blow up on .trim().
$('send').onclick = () => send();
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px';
});

function edgePath(a, b) {
  const x1 = a.x + 230, y1 = a.y + 34, x2 = b.x, y2 = b.y + 34;
  const m = (x1 + x2) / 2;
  return `M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`;
}

function drawGraph(g) {
  if (!g.nodes.length) {
    $('graph').innerHTML = '<div class="empty">Your quest map is empty.<br>' +
      '<b>Tell me what you want to make happen</b> — over in Talk.</div>';
    return;
  }
  const pos = {}; g.nodes.forEach(n => pos[n.id] = n.position);
  const W = Math.max(...g.nodes.map(n => n.position.x)) + 300;
  const H = Math.max(...g.nodes.map(n => n.position.y)) + 130;

  const edges = g.edges.map(e => {
    const a = pos[e.source], b = pos[e.target];
    return (a && b) ? `<path d="${edgePath(a,b)}" fill="none" stroke="#2A3040"
      stroke-width="1.7" marker-end="url(#ar)"/>` : '';
  }).join('');

  const nodes = g.nodes.map(n => {
    const d = n.data, sel = n.id === selected ? ' sel' : '';
    const label = d.label.length > 28 ? d.label.slice(0, 27) + '…' : d.label;
    const badge = d.tools.length ? `<g>
        <circle cx="212" cy="16" r="9" fill="#FFC24B"/>
        <text x="212" y="20" text-anchor="middle" font-size="10.5" font-weight="800"
              fill="#1A1A1A">${d.tools.length}</text></g>` : '';
    const ring = d.ready ? `<rect class="ready" x="-4" y="-4" width="238" height="76"
        rx="14" fill="none" stroke="#4C8DFF" stroke-width="2.5"/>` : '';
    const check = d.status === 'done'
      ? `<text x="206" y="52" font-size="15" fill="#3DD68C">✔</text>` : '';
    // tabindex + role + aria-label, because an SVG <g> with a click handler is
    // invisible to the keyboard and announced as nothing. The quest map is the
    // centrepiece of this product; a mouse-only centrepiece is a mouse-only product.
    // The label reads the way someone would say it out loud, not as a field dump.
    const say = `${d.label}. ${d.status}`
      + (d.tools.length ? `, ${d.tools.length} tool${d.tools.length > 1 ? 's' : ''}` : '')
      + (d.ready ? ', ready to start' : '')
      + (d.effort_mins ? `, about ${d.effort_mins} minutes` : '');
    return `<g class="node${sel}" transform="translate(${n.position.x},${n.position.y})"
              data-id="${esc(n.id)}" tabindex="0" role="button"
              aria-label="${esc(say)}">
        ${ring}
        <rect class="card" width="230" height="68" rx="12" fill="#12151D"
              stroke="${d.color}" stroke-width="1.6"/>
        <rect width="4" height="68" rx="2" fill="${d.color}"/>
        <text x="16" y="27" font-size="13" font-weight="650" fill="#EDEFF3">${esc(label)}</text>
        <text x="16" y="47" font-size="10.5" fill="#8B93A7">${esc(d.status)}${
          d.effort_mins ? ' · ' + d.effort_mins + ' min' : ''}</text>
        ${badge}${check}
      </g>`;
  }).join('');

  $('graph').innerHTML = `<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
      markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2A3040"/></marker>
    </defs>${edges}${nodes}</svg>`;

  const open = el => {
    selected = el.dataset.id;
    showQuest(g.nodes.find(n => n.id === selected));
    document.querySelector('.tab[data-p="quest"]').click();
    drawGraph(g);
    // The redraw replaces the SVG, so the element that had focus is gone. Put focus
    // on its replacement or the keyboard user is dumped back at the top of the page.
    const again = $('graph').querySelector(`.node[data-id="${CSS.escape(selected)}"]`);
    if (again) again.focus();
  };
  $('graph').querySelectorAll('.node').forEach(el => {
    el.onclick = () => open(el);
    el.onkeydown = e => {
      // Enter and Space are what `role="button"` promises. A promise the element does
      // not keep is worse than no role at all.
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el); }
    };
  });
}

// Everything Claude needs to actually help with this step, in one paste: the goal it
// serves, the step, how you know you're done, and the source of any tool the agents
// built for it. Without the charter the step reads as context-free busywork.
function questPrompt(n) {
  const d = n.data;
  const c = charter || {};
  const L = [];
  if (c.title || c.outcome) L.push(`I'm working toward: ${c.title || c.outcome}`);
  if (c.outcome && c.title && c.outcome !== c.title) L.push(`The outcome I want: ${c.outcome}`);
  if (c.definition_of_done) L.push(`Definition of done: ${c.definition_of_done}`);
  if (c.deadline) L.push(`Deadline: ${c.deadline}`);
  if ((c.constraints || []).length) L.push(`My constraints: ${c.constraints.join('; ')}`);
  if (groupFacts.length) L.push(`What we've learned so far: ${groupFacts.join('; ')}`);

  L.push('', `## The step I'm on: ${d.label}`);
  if (d.description) L.push(d.description);
  L.push(`Cleared when: ${d.acceptance_criteria}`);
  if (d.effort_mins) L.push(`Estimated effort: ${d.effort_mins} minutes`);
  if ((d.evidence || []).length) L.push(`Proof recorded so far: ${d.evidence.join('; ')}`);

  for (const t of d.tools) {
    const full = toolsById[t.id] || {};
    L.push('', `## Tool my agents built for this step: ${t.name} (${t.type})`);
    if (full.usage) L.push(full.usage);
    if (full.degraded || t.degraded)
      L.push('Note: this one degraded to a plain checklist -- the build failed.');
    if (full.source) L.push('', '```', full.source, '```');
  }

  L.push('', 'Walk me through actually doing this step. Ask me anything you need.');
  return L.join('\n');
}

function showQuest(n) {
  if (!n) return;
  const d = n.data;
  $('detail').className = '';
  $('detail').innerHTML = `<div class="quest">
    <h3>${esc(d.label)}</h3>
    <div style="font-size:11px;color:var(--dim)">${esc(d.status)}${
      d.effort_mins ? ' · ' + d.effort_mins + ' min' : ''}</div>
    <div class="crit"><b>Cleared when:</b> ${esc(d.acceptance_criteria)}</div>
    ${d.evidence?.length ? `<div class="crit"><b>Proof:</b> ${
      d.evidence.map(esc).join('; ')}</div>` : ''}
    ${d.tools.map(t => `<div class="tool">
        <div class="t">${esc(t.type)}${t.degraded ? ' · degraded' : ''}</div>
        <div>${esc(t.name)}</div>
        <div class="row">
          <button class="send" data-open="${esc(t.id)}">Open tool</button>
          <button data-fb="up"   data-t="${esc(t.id)}">👍 helped</button>
          <button data-fb="down" data-t="${esc(t.id)}">👎 didn't</button>
        </div></div>`).join('') ||
      '<div style="color:var(--faint);font-size:12.5px">No tool needed here.</div>'}
    <div class="row">
      <button id="workon">Work on this</button>
      <button id="forclaude" class="claude" title="Copy this step, the goal it serves,
and any tool built for it -- paste straight into Claude">Copy for Claude</button>
    </div>
  </div>`;

  const w = $('workon');
  if (w) w.onclick = () => {
    document.querySelector('.tab[data-p="chat"]').click();
    $('input').value = `Let's work on "${d.label}". What do I do first?`;
    $('input').focus();
  };
  const fc = $('forclaude');
  if (fc) fc.onclick = () => copyText(questPrompt(n), fc);
  $('detail').querySelectorAll('[data-open]')
    .forEach(b => b.onclick = () => openTool(b.dataset.open));
  $('detail').querySelectorAll('[data-fb]').forEach(b => b.onclick = () => askWhy(b));
}

//: This used to call window.prompt(). Two problems, both fatal for a demo: a native
//: modal over a dark app looks like a browser error, and it BLOCKS the page, so no
//: automated check could ever click this button -- which is part of why the whole
//: feedback path went untested long enough to become write-only. Inline instead.
function askWhy(btn) {
  const tool = btn.closest('.tool');
  if (tool.querySelector('.why')) return;
  const down = btn.dataset.fb === 'down';
  const box = document.createElement('div');
  box.className = 'why';
  box.innerHTML = `
    <input id="whytext" placeholder="${down
      ? 'What was wrong with it? The next one is built from this.'
      : 'What made it useful? (optional)'}" />
    <button class="send" id="whysend">Send</button>`;
  tool.appendChild(box);
  const text = box.querySelector('#whytext');
  text.focus();

  // NOT named `send` -- that is the global that starts an agent turn, and shadowing it
  // here would make the Rebuild button call this function recursively instead.
  const submit = async () => {
    const reason = text.value.trim();
    box.innerHTML = '<span class="wait">sending…</span>';
    try {
      await api(`/challenges/${challengeId}/feedback`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ target_type: 'tool', target_id: btn.dataset.t,
                               verdict: btn.dataset.fb, reason }),
      });
    } catch (e) {
      box.innerHTML = '<span class="wait">could not save — ' + esc(e.message) + '</span>';
      return;
    }
    tool.querySelectorAll('[data-fb]').forEach(x => x.disabled = true);
    btn.textContent = 'recorded ✓';

    if (!down) {
      box.className = 'why done';
      box.textContent = 'Noted — more like this one.';
      return;
    }

    // Telling someone "now go and ask for a rebuild" is asking them to do the
    // product's job. The reason is already stored and the Quartermaster already reads
    // it; all that was missing was the one click that starts the turn.
    box.className = 'why done';
    box.innerHTML = 'Noted. ';
    const go = document.createElement('button');
    go.className = 'send';
    go.id = 'rebuild';
    go.textContent = 'Rebuild it →';
    go.onclick = () => {
      go.disabled = true;
      document.querySelector('.tab[data-p="chat"]').click();
      $('input').value = rebuildPrompt(tool, reason);
      send();
    };
    box.appendChild(go);
  };

  box.querySelector('#whysend').onclick = submit;
  text.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

//: The rebuild turn. Names the node, the tool and the objection, because the
//: Quartermaster reads the rejection from the store but the CHAT still has to say
//: which step we are talking about -- otherwise Warden has to guess, and it will guess
//: the node the user is looking at only by luck.
function rebuildPrompt(toolEl, reason) {
  const name = toolEl.querySelector('div:nth-child(2)')?.textContent.trim() || 'that tool';
  const step = $('detail').querySelector('h3')?.textContent.trim() || '';
  return `The tool "${name}"${step ? ` on "${step}"` : ''} didn't work for me` +
         `${reason ? `: ${reason}` : '.'}\n\n` +
         `Please build a different one for that step. Not a reworded version of the ` +
         `same idea -- I've already read that one.`;
}

// ---------------------------------------------------------------- tool viewer
// The Toolwright emits a self-contained HTML document for mini_app, structured JSON
// for checklist, Python for calculator/tracker/drill, and plain text otherwise.
// Render each in the form that lets you actually use it.

const looksHTML = s => /<html[\s>]|<!doctype html/i.test(s || '');
const looksPython = s => /^\s*(import |from |def |class |#!)/m.test(s || '');

//: The model decides the JSON shape, so accept the shapes it plausibly emits and
//: fall back to showing raw JSON rather than rendering an empty list.
function checklistItems(src) {
  let data;
  try { data = JSON.parse(src); } catch { return null; }
  const findArray = v => {
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      for (const k of ['items', 'steps', 'checklist', 'tasks', 'list'])
        if (Array.isArray(v[k])) return v[k];
      for (const k of Object.keys(v)) if (Array.isArray(v[k])) return v[k];
    }
    return null;
  };
  const arr = findArray(data);
  if (!arr || !arr.length) return null;

  const items = arr.map(it => {
    if (typeof it === 'string') return { text: it, note: '' };
    if (it && typeof it === 'object') {
      const text = it.text || it.item || it.task || it.label || it.title ||
                   it.step || it.name || it.description;
      if (!text) return null;
      const note = it.note || it.detail || it.details || it.hint ||
                   (it.description && it.description !== text ? it.description : '');
      return { text: String(text), note: note ? String(note) : '' };
    }
    return null;
  }).filter(Boolean);
  return items.length ? items : null;
}

function toolAsText(t) {
  const parts = [`# ${t.name || 'Tool'} (${t.type || 'tool'})`];
  if (t.usage) parts.push('', t.usage);
  if (t.source) parts.push('', '```', t.source, '```');
  if (t.smoke_test_output) parts.push('', `Smoke test output: ${t.smoke_test_output}`);
  return parts.join('\n');
}

function renderTool(t) {
  const stage = $('m-stage');
  const src = t.source || '';
  stage.innerHTML = '';

  if (!src) {
    stage.innerHTML = '<div class="empty">This tool has no saved content.</div>';
    return;
  }

  // A self-contained document: run it. Sandboxed with no same-origin, so it cannot
  // reach this page, its storage, or the session.
  if (t.type === 'mini_app' || looksHTML(src)) {
    const f = document.createElement('iframe');
    f.id = 'frame';
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-modals');
    f.srcdoc = src;
    stage.appendChild(f);
    return;
  }

  if (t.type === 'checklist') {
    const items = checklistItems(src);
    if (items) {
      const key = 'ca_check_' + t.id;
      let done = [];
      try { done = JSON.parse(localStorage.getItem(key)) || []; } catch {}
      items.forEach((item, i) => {
        const row = document.createElement('label');
        row.className = 'check' + (done.includes(i) ? ' done' : '');
        row.innerHTML = `<input type="checkbox"${done.includes(i) ? ' checked' : ''}>
          <span>${esc(item.text)}${
            item.note ? `<span class="note">${esc(item.note)}</span>` : ''}</span>`;
        row.querySelector('input').onchange = e => {
          row.classList.toggle('done', e.target.checked);
          done = e.target.checked ? [...done, i] : done.filter(x => x !== i);
          localStorage.setItem(key, JSON.stringify(done));
        };
        stage.appendChild(row);
      });
      return;
    }
  }

  const pre = document.createElement('pre');
  pre.className = 'src';
  pre.textContent = src;
  stage.appendChild(pre);
}

function openTool(id) {
  const t = toolsById[id];
  if (!t) return;

  $('m-name').textContent = t.name || 'Tool';
  $('m-type').textContent = t.type || 'tool';

  const smoke = $('m-smoke');
  if (t.degraded) {
    smoke.textContent = 'degraded';
    smoke.className = 'badge warn';
  } else if (t.smoke_test_passed) {
    smoke.textContent = 'smoke test passed';
    smoke.className = 'badge ok';
  } else {
    smoke.textContent = 'untested';
    smoke.className = 'badge warn';
  }

  const usage = $('m-usage');
  usage.innerHTML = md(t.usage || '');
  usage.style.display = t.usage ? '' : 'none';

  renderTool(t);

  $('m-copy').onclick = e => copyText(toolAsText(t), e.target);
  $('m-claude').onclick = e => copyText(
    `${toolAsText(t)}\n\nHelp me use this.`, e.target);
  $('m-download').onclick = () => {
    const ext = looksHTML(t.source) ? 'html'
      : t.type === 'checklist' ? 'json'
      : looksPython(t.source) ? 'py' : 'txt';
    const name = (t.name || 'tool').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    const url = URL.createObjectURL(new Blob([t.source || ''], {type: 'text/plain'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name}.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  };

  $('modal').classList.add('on');
  // Move focus INTO the dialog. Without this a keyboard user is still tabbing through
  // the quest map behind a full-screen overlay they cannot see past, and a screen
  // reader never announces that anything opened.
  toolOpener = document.activeElement;
  $('m-close').focus();
}

//: Whoever opened the modal, so focus can go back there. Dumping focus at the top of
//: the document on close is the other half of the same bug.
let toolOpener = null;

function closeTool() {
  $('modal').classList.remove('on');
  $('m-stage').innerHTML = '';   // stop any running mini-app
  if (toolOpener && document.contains(toolOpener)) toolOpener.focus();
  toolOpener = null;
}

$('m-close').onclick = closeTool;
$('modal').onclick = e => { if (e.target.id === 'modal') closeTool(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('modal').classList.contains('on')) closeTool();
});

function drawJournal(entries) {
  if (entries.length === lastJournal) return;
  lastJournal = entries.length;
  const el = $('journal');
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
  el.innerHTML = entries.map(e => `<div class="entry">
      <span class="who2">${esc(e.actor)}</span>
      <span class="kind ${esc(e.kind)}">${esc(e.kind)}</span>
      <div>${esc(e.text)}</div></div>`).join('')
    || '<div class="empty">No notes yet.</div>';
  if (stick) el.scrollTop = el.scrollHeight;
}

function rememberChallenge(cid) { localStorage.setItem('ca_last', cid); }

// Which quest this browser lands on with a bare /app.
//
// It used to be challenges[0] -- the newest in the store. On a laptop that is a
// convenience. On a public URL with judges on it, it means the second person to open
// the link is dropped into the first person's quest, reading someone else's goal
// before they have typed anything. Land on the last quest THIS browser was on, and
// otherwise on a clean slate. The picker still lists everything.
async function pickChallenge() {
  const { challenges } = await api('/challenges');
  const p = $('picker');
  p.innerHTML = challenges.map(c =>
    `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('')
    || '<option value="">— no quests yet —</option>';
  p.style.display = challenges.length ? '' : 'none';

  const known = id => id && challenges.some(c => c.id === id);
  if (!known(challengeId)) challengeId = null;
  if (!challengeId && known(localStorage.getItem('ca_last')))
    challengeId = localStorage.getItem('ca_last');

  if (challengeId) { p.value = challengeId; rememberChallenge(challengeId); }
  else p.selectedIndex = -1;

  p.onchange = () => { challengeId = p.value; selected = null; lastJournal = -1;
                       sessionId = null; joined = null; rememberChallenge(challengeId);
                       history.replaceState(null,'','?id='+challengeId);
                       refresh(); };
  return challenges.length > 0;
}

//: The roster is the only proof a teammate actually arrived. Facts alone are not
//: enough -- someone can be reading the quest for ten minutes before they discover
//: anything, and until they do the app would look single-player.
function drawParty(members) {
  const others = members.filter(m => m !== userId);
  // You may not be on the roster yet -- membership is recorded the first time you
  // actually talk to the agents, not merely for opening the page. Count yourself
  // either way, so the badge and the sentence never disagree.
  const total = others.length + 1;
  $('c-party').textContent = total;
  $('roster').innerHTML = others.length
    ? `<b>${total}</b> on this quest — you and ${
        others.map(m => `<b>${esc(m)}</b>`).join(', ')}.`
    : 'Just you so far. Hit Invite and send someone the link.';
}

//: An invite is a link to this exact challenge. The teammate keeps their own user id
//: but the server files their work under the challenge's group, so their discoveries
//: land in everyone's Party Knowledge. See _group_id() in services/tools.py.
$('invite').onclick = e => {
  if (!challengeId) return copyText('', e.target);
  copyText(location.origin + location.pathname + '?id=' + challengeId, e.target);
};

//: Announce yourself once per challenge. Without this the roster only updated when the
//: model happened to call a tool, so a teammate could sit reading the quest for five
//: minutes while both screens still said "1 in party".
let joined = null;
async function joinParty() {
  if (!challengeId || joined === challengeId) return;
  joined = challengeId;
  try {
    await api(`/challenges/${challengeId}/join`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ user_id: userId }),
    });
  } catch (e) { joined = null; console.error(e); }
}

function setLive(ok) {
  const dot = $('live');
  dot.style.color = ok ? 'var(--done)' : 'var(--blocked)';
  dot.textContent = ok ? '●' : '⚠';
  dot.title = ok ? 'Connected' : 'Cannot reach the server — still retrying';
  // The word under the dot is the part that actually communicates.
  dot.nextElementSibling.textContent = ok ? 'live' : 'offline';
}

//: The quest list changes when someone creates a quest -- which is a thing we are told
//: about, not something worth asking every 1.2 seconds. Re-listing on every poll cost a
//: full challenges scan each time, and the picker never even rendered the result twice.
let listedOnce = false;
async function refresh(relist) {
  try {
    if (relist || !listedOnce) { await pickChallenge(); listedOnce = true; }
    await joinParty();
    if (!challengeId) {
      drawGraph({ nodes: [], edges: [] });
      $('title').className = 'empty';
      $('title').textContent = 'no quest yet — say what you want to make happen';
      return;
    }
    // ONE request. This was four, which meant four existence checks and a second pass
    // over nodes and tools on every poll -- and the poll runs every 1.2s during a run.
    const d = await api(`/challenges/${challengeId}/dashboard`);
    const s = d.summary, g = d.graph, j = d.journal, t = d.tools;
    charter = s.charter || {};
    groupFacts = s.group_facts || [];
    toolsById = Object.fromEntries((t.tools || []).map(x => [x.id, x]));
    // The title fills itself in the moment the charter is saved.
    const name = s.charter.title || s.charter.outcome || '';
    $('title').className = name ? '' : 'empty';
    $('title').textContent = name || 'no quest yet — say what you want to make happen';
    $('c-done').textContent = s.counts.done;
    $('c-nodes').textContent = s.counts.nodes;
    $('c-tools').textContent = s.counts.tools;
    $('xp').style.width = (s.counts.nodes
      ? Math.round(100 * s.counts.done / s.counts.nodes) : 0) + '%';
    drawParty(s.party || []);
    $('facts').innerHTML = s.group_facts.length
      ? s.group_facts.map(f => `<li>${esc(f)}</li>`).join('')
      : '<li style="color:var(--faint)">Nothing learned yet. Discoveries land here for the whole party.</li>';
    drawGraph(g);
    drawJournal(j.entries);
    // Rebuilding the quest panel replaces its DOM, which would blow away a reason the
    // user is halfway through typing and steal focus mid-word. The panel is only
    // interesting when it changes; a half-typed sentence is interesting the whole time.
    const typing = $('detail').contains(document.activeElement)
                   && document.activeElement.tagName === 'INPUT';
    if (selected && !typing) showQuest(g.nodes.find(n => n.id === selected));
    setLive(true);
  } catch (e) {
    // A dot changing colour is not a message. It is also the entire signal for a
    // colour-blind user, and it was the ONLY thing that happened when the read API
    // stopped answering -- so a stale map looked exactly like a quiet one.
    setLive(false);
    console.error(e);
  }
}

bubble('bot', 'warden',
  "Tell me something you want to be true that isn't yet.\n\n" +
  "I'll ask a few questions, map it into quests, then build the tools each one needs.");
refresh();

// The old line was `setInterval(() => { if (!busy) refresh(); }, 4000)`, which froze
// the entire read side for the whole length of a run -- and a FORGE run is a minute.
// So during the one stretch where the map grows from nothing to eleven nodes, four
// tools get built in parallel and the journal fills with agent decisions, the screen
// showed none of it and then snapped to the finished state at the end. The most
// interesting thing this product does was invisible while it happened.
//
// Poll FASTER while a run is live, not slower.
(function poll() {
  refresh().finally(() => setTimeout(poll, busy ? 1200 : 4000));
})();
$('input').focus();
</script>
</body>
</html>
