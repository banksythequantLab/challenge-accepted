<title>Challenge Accepted — Architecture</title>
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:1460px;margin:0 auto;padding:16px;}
  svg{width:100%;height:auto;display:block;}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#202124;}

  .h2{font-size:14px;fill:#5F6368;}
  .band{font-size:15px;font-weight:700;fill:#3C4043;letter-spacing:.4px;}
  .card{font-size:15px;font-weight:600;}
  .sub{font-size:11.5px;fill:#5F6368;}
  .sub2{font-size:11px;fill:#5F6368;}

<body>
<div class="wrap">
<svg viewBox="0 0 1440 1215" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Challenge Accepted system architecture diagram">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6368"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/>
    </marker>
  </defs>

  <text class="h1" x="40" y="46">Challenge Accepted</text>
  <text class="h2" x="40" y="72">Multi-agent goal decomposition with runtime tool synthesis and shared group memory  ·  Google ADK + Gemini 3.6 Flash  ·  All Things Agentic — Collaborative Partner track</text>

  <rect x="40" y="110" width="1360" height="150" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <text class="band" x="66" y="140">CLIENT  —  single static HTML file served by the same Cloud Run service  ·  anonymous ids in localStorage</text>

  <rect x="70" y="158" width="420" height="78" rx="9" fill="#fff" stroke="#4285F4" stroke-width="1.2"/>
  <rect x="70" y="158" width="5" height="78" rx="2.5" fill="#4285F4"/>
  <text class="card" x="90" y="184">Quest Map  (hand-drawn SVG)</text>
  <text class="sub" x="90" y="204">Live DAG of micro-task nodes, dependencies,</text>
  <text class="sub" x="90" y="220">status. Each node carries its tools. No build step.</text>

  <rect x="510" y="158" width="420" height="78" rx="9" fill="#fff" stroke="#4285F4" stroke-width="1.2"/>
  <rect x="510" y="158" width="5" height="78" rx="2.5" fill="#34A853"/>
  <text class="card" x="530" y="184">Journal Panel  &#8592; &#8220;takes notes&#8221;</text>
  <text class="sub" x="530" y="204">Human-readable feed of every agent decision,</text>
  <text class="sub" x="530" y="220">question, answer, insight and blocker.</text>

  <rect x="950" y="158" width="420" height="78" rx="9" fill="#fff" stroke="#4285F4" stroke-width="1.2"/>
  <rect x="950" y="158" width="5" height="78" rx="2.5" fill="#EA4335"/>
  <text class="card" x="970" y="184">Feedback Capture  &#128077; / &#128078;</text>
  <text class="sub" x="970" y="204">Verdict + reason on every node, tool and</text>
  <text class="sub" x="970" y="220">question. Re-ranks the next generation.</text>

  <line x1="720" y1="260" x2="720" y2="296" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <text class="edge" x="732" y="283">HTTPS / SSE stream</text>

  <rect x="40" y="300" width="1360" height="462" rx="12" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5"/>
  <text class="band" x="66" y="330">AGENT SERVICE  —  Cloud Run  ·  Google Agent Development Kit (Python)</text>

  <rect x="70" y="344" width="1300" height="54" rx="9" fill="#fff" stroke="#5F6368" stroke-width="1.6"/>
  <rect x="70" y="344" width="5" height="54" rx="2.5" fill="#5F6368"/>
  <rect x="92" y="360" width="106" height="22" rx="11" fill="#5F6368"/>
  <text class="tag" x="106" y="375">COORDINATOR</text>
  <text class="card" x="212" y="371">1 · Warden</text>
  <text class="sub" x="212" y="389">Root agent. Owns the session, routes to sub-agents, enforces the invariant: never guess when you can ask.</text>
  <text class="mono" x="1180" y="378">gemini-3.6-flash</text>

  <rect x="70" y="416" width="295" height="186" rx="9" fill="#fff" stroke="#DADCE0" stroke-width="1.2"/>
  <rect x="70" y="416" width="295" height="30" rx="9" fill="#4285F4"/>
  <rect x="70" y="437" width="295" height="9" fill="#4285F4"/>
  <text class="pill" x="86" y="436">PHASE 1 · ACCEPT</text>
  <text class="sub2" x="252" y="436" fill="#fff">clarify the goal</text>
  <rect x="84" y="458" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#4285F4" stroke-width="1"/>
  <text class="card" x="98" y="479">2 · Interviewer</text>
  <text class="sub" x="98" y="497">5&#8211;9 questions that change the graph.</text>
  <text class="mono" x="98" y="512">mode="task"  ·  finish_task()</text>
  <rect x="84" y="528" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#4285F4" stroke-width="1"/>
  <text class="card" x="98" y="549">9 · Scout</text>
  <text class="sub" x="98" y="567">Grounded research for live facts.</text>
  <text class="mono" x="98" y="582">single_turn  ·  google_search</text>

  <rect x="405" y="416" width="295" height="186" rx="9" fill="#fff" stroke="#DADCE0" stroke-width="1.2"/>
  <rect x="405" y="416" width="295" height="30" rx="9" fill="#34A853"/>
  <rect x="405" y="437" width="295" height="9" fill="#34A853"/>
  <text class="pill" x="421" y="436">PHASE 2 · MAP</text>
  <text class="sub2" x="566" y="436" fill="#fff">draw the goal graph</text>
  <rect x="419" y="458" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#34A853" stroke-width="1"/>
  <text class="card" x="433" y="479">3 · Cartographer</text>
  <text class="sub" x="433" y="497">8&#8211;20 nodes &#8804;2h each + edges +</text>
  <text class="sub" x="433" y="512">written acceptance criteria.</text>
  <rect x="419" y="528" width="267" height="60" rx="7" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="sub" x="433" y="549" font-weight="600" fill="#3C4043">Two-pass decomposition</text>
  <text class="sub" x="433" y="566">outline &#8594; expand, with a thinking</text>
  <text class="sub" x="433" y="581">budget. Flash-only needs this.</text>

  <rect x="740" y="416" width="295" height="186" rx="9" fill="#fff" stroke="#DADCE0" stroke-width="1.2"/>
  <rect x="740" y="416" width="295" height="30" rx="9" fill="#F9AB00"/>
  <rect x="740" y="437" width="295" height="9" fill="#F9AB00"/>
  <text class="pill" x="756" y="436">PHASE 3 · FORGE</text>
  <text class="sub2" x="890" y="436" fill="#fff">build the missing tools</text>
  <rect x="754" y="458" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#F9AB00" stroke-width="1"/>
  <text class="card" x="768" y="479">4 · Quartermaster</text>
  <text class="sub" x="768" y="497">Per node: what capability is missing?</text>
  <text class="mono" x="768" y="512">&#8594; ToolSpec | none_needed</text>
  <rect x="754" y="528" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#F9AB00" stroke-width="1.6"/>
  <text class="card" x="768" y="549">5 · Toolwright  &#215;N parallel</text>
  <text class="sub" x="768" y="567">Builds + smoke-tests the tool.</text>
  <text class="mono" x="768" y="582">ParallelAgent  ·  Firestore = truth</text>

  <rect x="1075" y="416" width="295" height="186" rx="9" fill="#fff" stroke="#DADCE0" stroke-width="1.2"/>
  <rect x="1075" y="416" width="295" height="30" rx="9" fill="#EA4335"/>
  <rect x="1075" y="437" width="295" height="9" fill="#EA4335"/>
  <text class="pill" x="1091" y="436">PHASE 4 · CLIMB</text>
  <text class="sub2" x="1235" y="436" fill="#fff">guide, verify, learn</text>
  <rect x="1089" y="458" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#EA4335" stroke-width="1"/>
  <text class="card" x="1103" y="479">6 · Coach</text>
  <text class="sub" x="1103" y="497">One node at a time. Hands over the tool.</text>
  <text class="mono" x="1103" y="512">mode="task"</text>
  <rect x="1089" y="528" width="267" height="60" rx="7" fill="#F8F9FA" stroke="#EA4335" stroke-width="1"/>
  <text class="card" x="1103" y="549">8 · Referee</text>
  <text class="sub" x="1103" y="567">Evidence check + feedback capture.</text>
  <text class="mono" x="1103" y="582">gemini-3.5-flash-lite</text>

  <line x1="365" y1="509" x2="401" y2="509" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="700" y1="509" x2="736" y2="509" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="1035" y1="509" x2="1071" y2="509" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <path d="M1222 602 L1222 626 L217 626 L217 604" fill="none" stroke="#EA4335" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <rect x="560" y="614" width="330" height="24" rx="12" fill="#F1F3F4"/>
  <text class="edge" x="576" y="631" fill="#EA4335">re-open: a discovered constraint redraws the graph</text>

  <rect x="70" y="650" width="1300" height="54" rx="9" fill="#fff" stroke="#34A853" stroke-width="1.6"/>
  <rect x="70" y="650" width="5" height="54" rx="2.5" fill="#34A853"/>
  <rect x="92" y="666" width="112" height="22" rx="11" fill="#34A853"/>
  <text class="tag" x="104" y="681">CROSS-CUTTING</text>
  <text class="card" x="218" y="677">7 · Archivist</text>
  <text class="sub" x="218" y="695">Writes after every phase transition: journal entry + deduplicated group facts, both in Firestore, scoped by groupId + challengeId.</text>
  <text class="mono" x="1170" y="684">gemini-3.5-flash-lite</text>

  <text class="mono" x="70" y="724">ADK modes:  task = may ask the user, auto-returns via finish_task()  ·  single_turn = no user interaction, parallel-safe.</text>
  <text class="mono" x="70" y="742">Scout is wrapped as an AgentTool — a built-in tool excludes all other tools on the same agent.  Task-mode agents are leaf-level and are disabled inside graph-based workflows (ADK Python v2.0.0).</text>

  <line x1="720" y1="762" x2="720" y2="776" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="40" y="780" width="1360" height="200" rx="12" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/>
  <text class="band" x="66" y="810">MODELS &amp; MANAGED SERVICES  —  Vertex AI  ·  Gemini API</text>
  <text class="mono" x="600" y="810" fill="#B4459F">Every card in this band is running in production today. Cards used to be dashed when they were not; none are.</text>

  <rect x="70" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="70" y="826" width="200" height="5" rx="2.5" fill="#9334E6"/>
  <text class="card" x="86" y="856">Gemini 3.6 Flash</text>
  <text class="sub" x="86" y="876">Reasoning tier.</text>
  <text class="sub" x="86" y="892">Warden, Interviewer,</text>
  <text class="sub" x="86" y="908">Cartographer,</text>
  <text class="sub" x="86" y="924">Quartermaster, Toolwright,</text>
  <text class="sub" x="86" y="940">Coach, Scout.</text>

  <rect x="290" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="290" y="826" width="200" height="5" rx="2.5" fill="#9334E6"/>
  <text class="card" x="306" y="856">Gemini 3.5 Flash-Lite</text>
  <text class="sub" x="306" y="876">Cheap tier &#8212; 5&#215; lower</text>
  <text class="sub" x="306" y="892">input cost.</text>
  <text class="sub" x="306" y="908">Archivist, Referee,</text>
  <text class="sub" x="306" y="924">classifiers, summarizers.</text>

  <rect x="510" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="510" y="826" width="200" height="5" rx="2.5" fill="#9334E6"/>
  <text class="card" x="526" y="856">Memory Bank</text>
  <text class="sub" x="526" y="876">Agent Engine 3470843…,</text>
  <text class="sub" x="526" y="892">us-central1. Read via</text>
  <text class="sub" x="526" y="908">preload_memory; written</text>
  <text class="sub" x="526" y="924">by save_charter and</text>
  <text class="sub" x="526" y="940">complete_node.</text>

  <rect x="730" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="730" y="826" width="200" height="5" rx="2.5" fill="#9334E6"/>
  <text class="card" x="746" y="856">Sessions</text>
  <text class="sub" x="746" y="876">Custom BaseSessionService</text>
  <text class="sub" x="746" y="892">on Firestore, registered</text>
  <text class="sub" x="746" y="908">as firestore:// via ADK's</text>
  <text class="sub" x="746" y="924">service registry. Survives</text>
  <text class="sub" x="746" y="940">an instance swap.</text>

  <rect x="950" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="950" y="826" width="200" height="5" rx="2.5" fill="#F9AB00"/>
  <text class="card" x="966" y="856">Code Execution</text>
  <text class="sub" x="966" y="876">BuiltInCodeExecutor today</text>
  <text class="sub" x="966" y="890">&#8212; model-side. Where</text>
  <text class="sub" x="966" y="906">Toolwright builds and</text>
  <text class="sub" x="966" y="922">smoke-tests. Swaps to a</text>
  <text class="sub" x="966" y="938">persistent Agent Engine</text>
  <text class="sub" x="966" y="954">sandbox via one env var.</text>

  <rect x="1170" y="826" width="200" height="132" rx="9" fill="#fff" stroke="#9334E6" stroke-width="1.2"/>
  <rect x="1170" y="826" width="200" height="5" rx="2.5" fill="#4285F4"/>
  <text class="card" x="1186" y="856">Search Grounding</text>
  <text class="sub" x="1186" y="876">Scout&#8217;s fact layer.</text>
  <text class="sub" x="1186" y="892">5k free requests/mo,</text>
  <text class="sub" x="1186" y="908">then $14 / 1k &#8212; a real</text>
  <text class="sub" x="1186" y="924">line item, so it is</text>
  <text class="sub" x="1186" y="940">gated, not default-on.</text>

  <line x1="720" y1="980" x2="720" y2="1016" stroke="#F9AB00" stroke-width="1.8" marker-end="url(#arb)"/>

  <rect x="40" y="1020" width="1360" height="160" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
  <text class="band" x="66" y="1050">SHARED DATA SOURCE  —  Firestore  ·  structured truth + real-time multiplayer</text>

  <rect x="70" y="1064" width="415" height="100" rx="9" fill="#fff" stroke="#F9AB00" stroke-width="1.2"/>
  <text class="monod" x="86" y="1086">/challenges/{id}</text>
  <text class="mono" x="86" y="1104">  charter, outcome, deadline, groupId, status</text>
  <text class="monod" x="86" y="1124">  /nodes/{id}</text>
  <text class="mono" x="86" y="1142">    acceptanceCriteria, dependsOn[], evidence[]</text>
  <text class="monod" x="86" y="1160">    /tools/{id}  spec, code, smokeTest, rating</text>

  <rect x="505" y="1064" width="415" height="100" rx="9" fill="#fff" stroke="#F9AB00" stroke-width="1.2"/>
  <text class="monod" x="521" y="1086">  /journal/{id}</text>
  <text class="mono" x="521" y="1104">    actor, kind, text, nodeId, createdAt</text>
  <text class="monod" x="521" y="1124">  /feedback/{id}</text>
  <text class="mono" x="521" y="1142">    targetType, targetId, verdict, reason</text>
  <text class="mono" x="521" y="1160">    &#8594; feeds the next generation&#8217;s ranking</text>

  <rect x="940" y="1064" width="430" height="100" rx="9" fill="#fff" stroke="#F9AB00" stroke-width="1.2"/>
  <text class="monod" x="956" y="1086">/groups/{id}</text>
  <text class="mono" x="956" y="1104">  members[], sharedFacts[], normsLearned[]</text>
  <text class="sub" x="956" y="1124" font-weight="600" fill="#3C4043">Goal-scoped, not corpus-scoped.</text>
  <text class="sub" x="956" y="1141">A fact one teammate discovers attaches to the node,</text>
  <text class="sub" x="956" y="1157">propagates to the group, and opens the next session.</text>

  <path d="M1400 197 L1424 197 L1424 1114 L1404 1114" fill="none" stroke="#F9AB00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arb)"/>
  <g transform="rotate(90 1418 640)">
    <text class="edge" x="1330" y="645" fill="#B06000">/api/* read model &#8212; polled every 4s, separate from the agent turn</text>
  </g>
</svg>
